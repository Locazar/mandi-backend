# Deployment configuration for the onboarding-nudges Cloud Run Job.
# Deploys a Cloud Run *Job* — a run-to-completion task meant to be invoked on
# a schedule by Cloud Scheduler (every 15-30 min; see cmd/onboarding-nudges'
# own doc comment for why any cadence is safe), not an always-on HTTP
# endpoint.
#
# Images go to Artifact Registry repo "mandi-backend" (asia-south1) — this
# project has no general-purpose gcr.io/legacy Container Registry set up;
# the only pre-existing repos are Cloud Functions' auto-managed
# "gcf-artifacts", not meant for manual pushes.

steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - '$_REGION-docker.pkg.dev/$PROJECT_ID/mandi-backend/onboarding-nudges:latest'
      - '-t'
      - '$_REGION-docker.pkg.dev/$PROJECT_ID/mandi-backend/onboarding-nudges:$COMMIT_SHA'
      - '-f'
      - 'cmd/onboarding-nudges/Dockerfile'
      - '.'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '$_REGION-docker.pkg.dev/$PROJECT_ID/mandi-backend/onboarding-nudges:$COMMIT_SHA'

  # Deploy/update the Cloud Run Job (must already exist — created once via
  # `gcloud run jobs create`, see mandi-backend/docs/onboarding-nudges-deploy.md).
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'jobs'
      - 'update'
      - '$_JOB_NAME'
      - '--image=$_REGION-docker.pkg.dev/$PROJECT_ID/mandi-backend/onboarding-nudges:$COMMIT_SHA'
      - '--region=$_REGION'

images:
  - '$_REGION-docker.pkg.dev/$PROJECT_ID/mandi-backend/onboarding-nudges:latest'
  - '$_REGION-docker.pkg.dev/$PROJECT_ID/mandi-backend/onboarding-nudges:$COMMIT_SHA'

substitutions:
  _REGION: 'asia-south1'
  _JOB_NAME: 'onboarding-nudges'

timeout: 1800s

options:
  machineType: 'N1_HIGHCPU_8'
