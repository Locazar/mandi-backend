# Deployment configuration for the onboarding-nudge-backfill Cloud Run Job.
# A ONE-TIME manual tool — not on any schedule. Deploy it, run it once with
# -apply, done.
#
# Images go to Artifact Registry repo "mandi-backend" (asia-south1) — see
# cmd/onboarding-nudges/cloudbuild.yaml for why (no legacy gcr.io registry
# set up in this project).

steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - '$_REGION-docker.pkg.dev/$PROJECT_ID/mandi-backend/onboarding-nudge-backfill:latest'
      - '-t'
      - '$_REGION-docker.pkg.dev/$PROJECT_ID/mandi-backend/onboarding-nudge-backfill:$COMMIT_SHA'
      - '-f'
      - 'cmd/onboarding-nudge-backfill/Dockerfile'
      - '.'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '$_REGION-docker.pkg.dev/$PROJECT_ID/mandi-backend/onboarding-nudge-backfill:$COMMIT_SHA'

  # Deploy/update the Cloud Run Job (must already exist — created once via
  # `gcloud run jobs create`, see mandi-backend/docs/onboarding-nudges-deploy.md).
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'jobs'
      - 'update'
      - '$_JOB_NAME'
      - '--image=$_REGION-docker.pkg.dev/$PROJECT_ID/mandi-backend/onboarding-nudge-backfill:$COMMIT_SHA'
      - '--region=$_REGION'

images:
  - '$_REGION-docker.pkg.dev/$PROJECT_ID/mandi-backend/onboarding-nudge-backfill:latest'
  - '$_REGION-docker.pkg.dev/$PROJECT_ID/mandi-backend/onboarding-nudge-backfill:$COMMIT_SHA'

substitutions:
  _REGION: 'asia-south1'
  _JOB_NAME: 'onboarding-nudge-backfill'

timeout: 1800s

options:
  machineType: 'N1_HIGHCPU_8'
